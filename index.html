<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyện MP3 Player</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="player-container">
        <h1 id="current-tap">Tập 001</h1>
        <div class="audio-player">
            <audio id="audioPlayer" controls>
                Your browser does not support the audio element.
            </audio>
        </div>
        <div class="controls">
            <label for="speedControl">Tốc độ: </label>
            <input type="range" id="speedControl" min="0.5" max="5" value="1" step="0.1">
            <span id="speedValue">1x</span>


            <label for="volumeControl">Âm lượng: </label>
            <input type="range" id="volumeControl" min="0" max="1" value="1" step="0.01">
            <span id="volumeValue">100%</span>
        </div>
        <div class="controls">
            <button id="prevBtn">⏪</button>
            <button id="playPauseBtn">▶️</button>
            <button id="nextBtn">⏩</button>
        </div>
    </div>

    <div class="playlist">
        <ul id="tapList">
            <!-- Audio list will be populated here -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
